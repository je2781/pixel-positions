
services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - postgres
    networks:
      - app
  postgres:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    env_file: .env
    volumes:
    #   - ./database/scripts/:/docker-entrypoint-initdb.d/
        - ./storage/db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DB_PORT} -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      start_period: 0s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

networks:
  app:

